<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero to 1k</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header>
  <nav class="tabs" id="tabs">
    <button data-tab="mutuals">Mutuals <span class="count" id="c-mutuals"></span></button>
    <button data-tab="rising">Rising <span class="count" id="c-rising"></span></button>
    <button data-tab="following">Following <span class="count" id="c-following"></span></button>
    <button data-tab="followers">Followers <span class="count" id="c-followers"></span></button>
    <button data-tab="connect">New builders <span class="count" id="c-connect"></span></button>
    <button data-tab="watched">Watched <span class="count" id="c-watched"></span></button>
    <button data-tab="trending">Trending <span class="count" id="c-trending"></span></button>
    <button data-tab="cleanup">Cleanup <span class="count" id="c-cleanup"></span></button>
    <button data-tab="memes">Memes <span class="count" id="c-memes"></span></button>
  </nav>
  <p class="purpose" id="purpose"></p>
  <div class="chips" id="topics"></div>
  <div class="bar">
    <button id="fetch" class="primary">Fetch</button>
    <span id="status" class="muted">…</span>
    <span class="spacer"></span>
    <button id="myrep" class="jobs" title="Replies you posted today (your computer's timezone). Click to refresh.">💬 …</button>
    <button id="jobs" class="jobs" title="Start or stop the background checks (Watched + Trending)"></button>
    <button id="clear" class="ghost" title="Hide everything on this page">Clear page</button>
    <button id="gear" class="icon" title="Filters">⚙</button>
  </div>
</header>
<main id="list"></main>
<div id="toast" hidden></div>
<section id="filters" hidden></section>
<div id="offline" hidden>
  <p><b>The finder isn't running.</b></p>
  <p class="muted">Start it on your computer:</p>
  <code>./finder/start.sh</code>
</div>
<script src="panel.js"></script>
</body></html>
